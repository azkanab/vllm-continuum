name: dagshare-image

on:
  push:
    branches: [dagshare]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dagshare-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free runner disk (base image is ~10 GB compressed)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vllm-dagshare" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: dagshare_exp/deploy/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            GIT_SHA=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:dagshare

      - name: Summary
        run: |
          echo "Pushed ${{ steps.img.outputs.name }}:${{ github.sha }} and :dagshare" >> "$GITHUB_STEP_SUMMARY"
          echo "First push creates a private package: make it public (Package settings > Change visibility) or set GHCR_TOKEN in deploy/.env." >> "$GITHUB_STEP_SUMMARY"
